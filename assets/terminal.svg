  <path d="M 2 16 Q 2 2 16 2 L 904 2 Q 918 2 918 16 L 918 36 L 2 36 Z" fill="#0f172a" fill-opacity="0.7" />
  <line x1="2" y1="36" x2="918" y2="36" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="19" r="4.5" fill="#10b981" />
  <text x="70" y="23" fill="#64748b" font-family="'Fira Code', monospace" font-size="11.5" font-weight="600">sparksidd@workstation: ~/architecture-spec</text>

