  <text x="44" y="138" class="t-key">"domains"</text><text x="120" y="138" class="t-punct">: [</text><text x="145" y="138" class="t-str">"Decentralized AMR Robotics"</text><text x="380" y="138" class="t-punct">, </text><text x="395" y="138" class="t-str">"Acoustic Signal Processing"</text><text x="640" y="138" class="t-punct">, </text><text x="655" y="138" class="t-str">"MIP Optimization"</text><text x="815" y="138" class="t-punct">],</text>

