  <text x="165" y="66" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13.5">~</text>
  <text x="178" y="66" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="13.5">$</text>
  <text x="195" y="66" class="t-cmd">cat telemetry_spec.json</text>

