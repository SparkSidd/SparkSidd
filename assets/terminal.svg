  <text x="235" y="160" class="t-key">"latency_saved"</text><text x="355" y="160" class="t-punct">: </text><text x="375" y="160" class="t-str">"24.89%"</text><text x="445" y="160" class="t-punct">, </text>
  <text x="465" y="160" class="t-key">"collisions"</text><text x="565" y="160" class="t-punct">: </text><text x="585" y="160" class="t-num">0</text><text x="600" y="160" class="t-punct">, </text>
  <text x="620" y="160" class="t-key">"sim_runs"</text><text x="700" y="160" class="t-punct">: </text><text x="720" y="160" class="t-num">3150</text>
  <text x="760" y="160" class="t-punct">},</text>

  <text x="44" y="182" class="t-key">"core_stack"</text><text x="140" y="182" class="t-punct">: [</text><text x="165" y="182" class="t-str">"ROS 2"</text><text x="225" y="182" class="t-punct">, </text><text x="240" y="182" class="t-str">"Python"</text><text x="315" y="182" class="t-punct">, </text><text x="330" y="182" class="t-str">"PyTorch"</text><text x="410" y="182" class="t-punct">, </text><text x="425" y="182" class="t-str">"FastAPI"</text><text x="505" y="182" class="t-punct">, </text><text x="520" y="182" class="t-str">"React 18"</text><text x="605" y="182" class="t-punct">, </text><text x="620" y="182" class="t-str">"Docker"</text><text x="690" y="182" class="t-punct">],</text>

  <text x="44" y="204" class="t-key">"live_portfolio"</text><text x="180" y="204" class="t-punct">: </text><text x="200" y="204" class="t-str">"https://www.siddharth.buzz/"</text><text x="445" y="204" class="t-punct">,</text>

  <text x="44" y="226" class="t-key">"status"</text><text x="120" y="226" class="t-punct">: </text><text x="140" y="226" class="t-str">"Available for High-Impact Engineering &amp; Research Roles"</text>

  <text x="24" y="248" class="t-punct">}</text>
