<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="100%" height="270">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>
    <style>
      .t-key { fill: #38bdf8; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; }
      .t-str { fill: #34d399; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
      .t-num { fill: #f59e0b; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
      .t-punct { fill: #94a3b8; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
      .t-cmd { fill: #f8fafc; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: 700; }
      .t-prompt { fill: #a855f7; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: 700; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; fill: #38bdf8; }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="2" y="2" width="916" height="266" rx="16" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.2" />

