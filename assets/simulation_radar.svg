<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 190" width="100%" height="190">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <style>
      @keyframes radarSweep {
        0% { transform: translateX(-150px); }
        100% { transform: translateX(760px); }
      }
      @keyframes robot1Move {
        0% { transform: translate(120px, 60px); }
        50% { transform: translate(280px, 60px); }
        100% { transform: translate(120px, 60px); }
      }
      @keyframes robot2Move {
        0% { transform: translate(450px, 120px); }
        50% { transform: translate(310px, 120px); }
        100% { transform: translate(450px, 120px); }
      }
      @keyframes robot3Move {
        0% { transform: translate(200px, 140px); }
        50% { transform: translate(200px, 45px); }
        100% { transform: translate(200px, 140px); }
      }
      @keyframes beaconPulse {
        0%, 100% { r: 4px; opacity: 1; }
        50% { r: 10px; opacity: 0.2; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .sweep-beam { animation: radarSweep 6s linear infinite; }
      .amr1 { animation: robot1Move 7s ease-in-out infinite; }
      .amr2 { animation: robot2Move 8s ease-in-out infinite; }
      .amr3 { animation: robot3Move 6.5s ease-in-out infinite; }
      .beacon { animation: beaconPulse 2s ease-out infinite; }
      .cur { animation: blinkCursor 1s infinite; }
    </style>
  </defs>

  <!-- Container Frame -->
  <rect x="1" y="1" width="738" height="188" rx="12" fill="url(#gridBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Top Simulation Header Bar -->
  <path d="M 1 12 Q 1 1 12 1 L 728 1 Q 739 1 739 12 L 739 30 L 1 30 Z" fill="#0f172a" fill-opacity="0.8" />
  <line x1="1" y1="30" x2="739" y2="30" stroke="#1e293b" stroke-width="1" />

  <!-- Status indicator -->
  <circle cx="16" cy="15" r="4" fill="#34d399" />
  <text x="28" y="19" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">AMR_COORDINATION_KERNEL // ACTIVE SIMULATION MAP</text>
  <text x="530" y="19" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5">COLLISION_RISK: 0.00%</text>

  <!-- Background Warehouse Grid -->
  <g stroke="#1e293b" stroke-opacity="0.4" stroke-width="0.8" stroke-dasharray="2,2">
    <!-- Horizontal Grid Lines -->
    <line x1="20" y1="50" x2="720" y2="50" />
    <line x1="20" y1="75" x2="720" y2="75" />
    <line x1="20" y1="100" x2="720" y2="100" />
    <line x1="20" y1="125" x2="720" y2="125" />
    <line x1="20" y1="150" x2="720" y2="150" />

    <!-- Vertical Grid Lines -->
    <line x1="60" y1="35" x2="60" y2="165" />
    <line x1="140" y1="35" x2="140" y2="165" />
    <line x1="220" y1="35" x2="220" y2="165" />
    <line x1="300" y1="35" x2="300" y2="165" />
    <line x1="380" y1="35" x2="380" y2="165" />
    <line x1="460" y1="35" x2="460" y2="165" />
    <line x1="540" y1="35" x2="540" y2="165" />
    <line x1="620" y1="35" x2="620" y2="165" />
    <line x1="700" y1="35" x2="700" y2="165" />
  </g>

  <!-- Stationary Obstacles (Warehouse Racks) -->
  <rect x="70" y="85" width="40" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
  <rect x="390" y="85" width="40" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
  <rect x="550" y="60" width="40" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8" />

  <!-- Target Waypoint Beacons -->
  <circle cx="280" cy="60" r="4" fill="#a855f7" />
  <circle cx="280" cy="60" r="4" fill="none" stroke="#a855f7" stroke-width="1.5" class="beacon" />
  <text x="290" y="64" fill="#c084fc" font-family="'Fira Code', monospace" font-size="9.5">WP_A</text>

  <circle cx="310" cy="120" r="4" fill="#38bdf8" />
  <circle cx="310" cy="120" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5" class="beacon" />
  <text x="320" y="124" fill="#7dd3fc" font-family="'Fira Code', monospace" font-size="9.5">WP_B</text>

  <!-- Radar Scan Beam -->
  <rect x="0" y="31" width="120" height="135" fill="url(#sweepGrad)" class="sweep-beam" />

  <!-- Animated Robots -->
  <!-- Robot #1 (Cyan) -->
  <g class="amr1">
    <rect x="-10" y="-8" width="20" height="16" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <text x="-16" y="-12" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9" font-weight="700">AMR#1</text>
  </g>

  <!-- Robot #2 (Emerald) -->
  <g class="amr2">
    <rect x="-10" y="-8" width="20" height="16" rx="4" fill="#059669" stroke="#34d399" stroke-width="1.2" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <text x="-16" y="24" fill="#34d399" font-family="'Fira Code', monospace" font-size="9" font-weight="700">AMR#2</text>
  </g>

  <!-- Robot #3 (Amber) -->
  <g class="amr3">
    <rect x="-10" y="-8" width="20" height="16" rx="4" fill="#d97706" stroke="#fbbf24" stroke-width="1.2" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <text x="14" y="4" fill="#fbbf24" font-family="'Fira Code', monospace" font-size="9" font-weight="700">AMR#3</text>
  </g>

  <!-- Bottom Telemetry HUD Line -->
  <path d="M 1 168 L 739 168" stroke="#1e293b" stroke-width="1" />
  <text x="16" y="181" fill="#64748b" font-family="'Fira Code', monospace" font-size="10">PIBT_TOKEN: PASSING</text>
  <text x="210" y="181" fill="#64748b" font-family="'Fira Code', monospace" font-size="10">SPACE_TIME_A*: OPTIMAL</text>
  <text x="430" y="181" fill="#64748b" font-family="'Fira Code', monospace" font-size="10">DEADLOCKS_DETECTED: 0</text>
  <text x="630" y="181" fill="#22c55e" font-family="'Fira Code', monospace" font-size="10" font-weight="700">STATUS: LIVE</text>
</svg>
