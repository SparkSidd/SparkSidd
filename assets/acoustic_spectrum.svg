<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 160" width="100%" height="160">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="waveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <style>
      @keyframes eqPulse1 { 0%, 100% { height: 24px; y: 96px; } 50% { height: 75px; y: 45px; } }
      @keyframes eqPulse2 { 0%, 100% { height: 60px; y: 60px; } 50% { height: 20px; y: 100px; } }
      @keyframes eqPulse3 { 0%, 100% { height: 40px; y: 80px; } 50% { height: 85px; y: 35px; } }
      @keyframes eqPulse4 { 0%, 100% { height: 80px; y: 40px; } 50% { height: 35px; y: 85px; } }
      @keyframes eqPulse5 { 0%, 100% { height: 30px; y: 90px; } 50% { height: 68px; y: 52px; } }
      @keyframes pingRadar { 0% { r: 6px; opacity: 1; } 100% { r: 24px; opacity: 0; } }

      .b1 { animation: eqPulse1 1.2s ease-in-out infinite; }
      .b2 { animation: eqPulse2 1.5s ease-in-out infinite; }
      .b3 { animation: eqPulse3 1.1s ease-in-out infinite; }
      .b4 { animation: eqPulse4 1.7s ease-in-out infinite; }
      .b5 { animation: eqPulse5 1.3s ease-in-out infinite; }
      .ping-wave { animation: pingRadar 2.5s cubic-bezier(0, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="1" y="1" width="738" height="158" rx="12" fill="url(#waveBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Title bar -->
  <path d="M 1 12 Q 1 1 12 1 L 728 1 Q 739 1 739 12 L 739 28 L 1 28 Z" fill="#0f172a" fill-opacity="0.8" />
  <line x1="1" y1="28" x2="739" y2="28" stroke="#1e293b" stroke-width="1" />
  <circle cx="16" cy="14" r="4" fill="#a855f7" />
  <text x="28" y="18" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">ECHOLOCATE // REAL-TIME GCC-PHAT ACOUSTIC SPECTRUM &amp; TDOA ANGLE</text>
  <text x="545" y="18" fill="#34d399" font-family="'Fira Code', monospace" font-size="10.5">SOURCE: θ = 42.8° (CONFIDENCE: 98.4%)</text>

  <!-- Left: Acoustic Waveform Equalizer (FFT Frequency Bins) -->
  <g transform="translate(30, 0)">
    <!-- Spectrum Baseline -->
    <line x1="0" y1="120" x2="420" y2="120" stroke="#334155" stroke-width="1" />
    
    <!-- 18 Animated Frequency Bars -->
    <rect class="b1" x="10" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b2" x="32" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b3" x="54" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b4" x="76" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b2" x="98" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b5" x="120" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b1" x="142" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b3" x="164" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b4" x="186" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b5" x="208" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b2" x="230" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b1" x="252" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b4" x="274" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b3" x="296" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b5" x="318" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b2" x="340" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b1" x="362" width="14" rx="3" fill="url(#eqGrad)" />
    <rect class="b4" x="384" width="14" rx="3" fill="url(#eqGrad)" />

    <!-- Frequency labels -->
    <text x="10" y="136" fill="#64748b" font-family="'Fira Code', monospace" font-size="9">100Hz</text>
    <text x="186" y="136" fill="#64748b" font-family="'Fira Code', monospace" font-size="9">4.2kHz (Peak TDOA)</text>
    <text x="375" y="136" fill="#64748b" font-family="'Fira Code', monospace" font-size="9">20kHz</text>
  </g>

  <!-- Divider -->
  <line x1="475" y1="36" x2="475" y2="148" stroke="#1e293b" stroke-width="1" />

  <!-- Right: Polar Multilateration Polar Scope -->
  <g transform="translate(605, 88)">
    <!-- Polar Range Rings -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#1e293b" stroke-width="1" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#334155" stroke-width="1" />

    <!-- Axis Crosshairs -->
    <line x1="-54" y1="0" x2="54" y2="0" stroke="#1e293b" stroke-width="0.8" />
    <line x1="0" y1="-54" x2="0" y2="54" stroke="#1e293b" stroke-width="0.8" />

    <!-- 4 Microphones in Array -->
    <rect x="-24" y="-24" width="6" height="6" rx="1" fill="#38bdf8" />
    <rect x="18" y="-24" width="6" height="6" rx="1" fill="#38bdf8" />
    <rect x="-24" y="18" width="6" height="6" rx="1" fill="#38bdf8" />
    <rect x="18" y="18" width="6" height="6" rx="1" fill="#38bdf8" />

    <!-- Angle Vector to Source (θ = 42.8°) -->
    <line x1="0" y1="0" x2="32" y2="-29" stroke="#f43f5e" stroke-width="2" />
    <circle cx="32" cy="-29" r="5" fill="#f43f5e" />
    <circle cx="32" cy="-29" r="6" fill="none" stroke="#f43f5e" stroke-width="1.5" class="ping-wave" />

    <!-- Labels -->
    <text x="38" y="-32" fill="#fb7185" font-family="'Fira Code', monospace" font-size="9" font-weight="700">SOURCE</text>
    <text x="-48" y="52" fill="#64748b" font-family="'Fira Code', monospace" font-size="8.5">4-MIC PYRAMID ARRAY</text>
  </g>
</svg>
