<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 375" width="100%" height="375">
  <defs>
    <!-- Background Gradient matching Cockpit Suite -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.4; }
      }
      .cursor-blink { animation: blinkCursor 1s step-start infinite; }
      .status-pulse { animation: pulseGlow 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Frame: Exactly matches Radar and Acoustic Scope -->
  <rect x="1" y="1" width="838" height="373" rx="12" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header / Titlebar -->
  <path d="M 1 12 Q 1 1 12 1 L 828 1 Q 839 1 839 12 L 839 30 L 1 30 Z" fill="#0b1120" />
  <line x1="1" y1="30" x2="839" y2="30" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots: Identical placement to Fig 1 & Fig 2 -->
  <circle cx="16" cy="15" r="4" fill="#ef4444" />
  <circle cx="30" cy="15" r="4" fill="#f59e0b" />
  <circle cx="44" cy="15" r="4" fill="#10b981" />

  <!-- Header Title -->
  <text x="65" y="19" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">TERMINAL // sparksidd@edge-node-01: ~/robotics-workspace [x86_64 // ROS 2 Humble]</text>
  <text x="630" y="19" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5">STATE: 0 DEADLOCKS</text>

  <!-- Terminal Content Area -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="11">
    
    <!-- Command 1: systemctl status -->
    <text x="20" y="54">
      <tspan fill="#34d399" font-weight="700">sparksidd@edge-node-01</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#f1f5f9">$ systemctl status siddharth.service --no-pager</tspan>
    </text>

    <!-- Service Title & Active Bullet -->
    <text x="20" y="75">
      <tspan fill="#10b981" font-weight="700" class="status-pulse">●</tspan>
      <tspan fill="#ffffff" font-weight="700"> siddharth.service</tspan>
      <tspan fill="#94a3b8"> - Autonomous Robotics &amp; Multi-Agent Systems Architect</tspan>
