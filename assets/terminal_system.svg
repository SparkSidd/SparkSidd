    <!-- Active Prompt with Cursor -->
    <text x="20" y="361">
      <tspan fill="#34d399" font-weight="700">sparksidd@edge-node-01</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#f1f5f9">$ </tspan>
      <tspan fill="#38bdf8" class="cursor-blink">█</tspan>
