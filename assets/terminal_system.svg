    <!-- Divider Line -->
    <line x1="20" y1="264" x2="820" y2="264" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="0.8" />

    <!-- Command 2: benchmark execution -->
    <text x="20" y="287">
      <tspan fill="#34d399" font-weight="700">sparksidd@edge-node-01</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#f1f5f9">$ sparksidd --run-benchmark --target=amr-fleet --agents=200</tspan>
    </text>

    <!-- Benchmark Log Lines -->
    <text x="20" y="307">
      <tspan fill="#38bdf8">[00.12s] Hungarian Allocation:</tspan>
      <tspan fill="#cbd5e1"> 200/200 tasks assigned with minimal Euclidean cost matrix.</tspan>
    </text>

    <text x="20" y="325">
