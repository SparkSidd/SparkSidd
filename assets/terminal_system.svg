<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="100%" height="390">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="60%" stop-color="#0b101e" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }
      .cursor-blink { animation: blinkCursor 1s step-start infinite; }
      .status-pulse { animation: pulseGlow 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="1" y="1" width="838" height="388" rx="10" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Terminal Header / Titlebar -->
  <path d="M 1 10 Q 1 1 10 1 L 828 1 Q 839 1 839 10 L 839 32 L 1 32 Z" fill="#0d1424" />
  <line x1="1" y1="32" x2="839" y2="32" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="18" cy="16" r="4.5" fill="#ef4444" />
  <circle cx="33" cy="16" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="16" r="4.5" fill="#10b981" />

  <!-- Window Title -->
  <text x="68" y="20" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">sparksidd@fleet-control: ~/robotics-workspace (ros2-humble / x86_64-linux)</text>
  <text x="640" y="20" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5">UPTIME: 24/7/365</text>

  <!-- Terminal Content Area -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="11" line-height="1.5">
    
    <!-- Command 1: systemctl status -->
    <text x="20" y="56">
      <tspan fill="#34d399" font-weight="700">sparksidd@fleet-control</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#f1f5f9">$ systemctl status siddharth.service --no-pager</tspan>
    </text>

    <!-- Service Title & Active Bullet -->
    <text x="20" y="78">
      <tspan fill="#10b981" font-weight="700" class="status-pulse">●</tspan>
      <tspan fill="#ffffff" font-weight="700"> siddharth.service</tspan>
      <tspan fill="#94a3b8"> - Autonomous Robotics &amp; Multi-Agent Systems Architect</tspan>
    </text>

    <!-- Service Details -->
    <text x="36" y="98">
      <tspan fill="#64748b">Loaded: </tspan>
      <tspan fill="#cbd5e1">loaded (/etc/systemd/system/siddharth.service; </tspan>
      <tspan fill="#34d399">enabled</tspan>
      <tspan fill="#cbd5e1">; vendor preset: enabled)</tspan>
    </text>

    <text x="36" y="118">
      <tspan fill="#64748b">Active: </tspan>
      <tspan fill="#10b981" font-weight="700">active (running)</tspan>
      <tspan fill="#cbd5e1"> since Mon 2024-01-01 00:00:00 UTC (uptime: 24/7 autonomous loop)</tspan>
    </text>

    <text x="36" y="138">
      <tspan fill="#64748b">  Docs: </tspan>
      <tspan fill="#38bdf8">https://www.siddharth.buzz/</tspan>
      <tspan fill="#64748b"> | Contact: </tspan>
      <tspan fill="#cbd5e1">siddharth.sk324@gmail.com</tspan>
    </text>

    <text x="36" y="158">
      <tspan fill="#64748b"> Tasks: </tspan>
      <tspan fill="#f59e0b" font-weight="700">200 active AMRs</tspan>
      <tspan fill="#94a3b8"> (Space-Time A* + PIBT; </tspan>
      <tspan fill="#34d399" font-weight="700">0 collisions</tspan>
      <tspan fill="#94a3b8">, 0 deadlocks across 200 runs)</tspan>
    </text>

    <text x="36" y="178">
      <tspan fill="#64748b">Memory: </tspan>
      <tspan fill="#cbd5e1">128.4M (Deterministic heap, Valgrind leak audit: 0 bytes)</tspan>
    </text>

    <!-- CGroup Processes -->
    <text x="36" y="198">
      <tspan fill="#64748b">CGroup: </tspan>
      <tspan fill="#94a3b8">/system.slice/siddharth.service</tspan>
    </text>

    <text x="36" y="216">
      <tspan fill="#64748b">        ├─1337 </tspan>
      <tspan fill="#a78bfa">/usr/bin/engineer</tspan>
      <tspan fill="#94a3b8"> --fleet=decentralized --pathfinding=space-time-a-star</tspan>
    </text>

    <text x="36" y="234">
      <tspan fill="#64748b">        ├─1338 </tspan>
      <tspan fill="#a78bfa">/opt/ros/humble/bin/pibt_resolver</tspan>
      <tspan fill="#94a3b8"> --cycle-breaker=tarjan --timeout=1.4ms</tspan>
    </text>

    <text x="36" y="252">
      <tspan fill="#64748b">        └─1339 </tspan>
      <tspan fill="#a78bfa">/usr/bin/gcc_phat_engine</tspan>
      <tspan fill="#94a3b8"> --array=4mic-tetrahedral --rate=48kHz</tspan>
    </text>

    <!-- Subtle divider line -->
    <line x1="20" y1="268" x2="820" y2="268" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="0.8" />

    <!-- Command 2: sparksidd benchmark -->
    <text x="20" y="292">
      <tspan fill="#34d399" font-weight="700">sparksidd@fleet-control</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#f1f5f9">$ sparksidd --run-benchmark --target=amr-fleet --agents=200</tspan>
    </text>

    <!-- Benchmark Log Output -->
    <text x="20" y="312">
      <tspan fill="#38bdf8">[00.12s] Hungarian Algorithm:</tspan>
      <tspan fill="#cbd5e1"> 200/200 tasks allocated with minimal Euclidean distance.</tspan>
    </text>

    <text x="20" y="330">
      <tspan fill="#f59e0b">[00.52s] PIBT Conflict Resolution:</tspan>
      <tspan fill="#cbd5e1"> 34 crossings detected; Tarjan cycle-breaker passed in 1.4ms.</tspan>
    </text>

    <text x="20" y="348">
      <tspan fill="#34d399" font-weight="700">[BENCHMARK RESULT]</tspan>
      <tspan fill="#ffffff" font-weight="700"> Collisions: 0 | Latency Saved: 24.89% | Status: 121/121 PASS</tspan>
    </text>

    <!-- Command 3: Prompt with blinking cursor -->
    <text x="20" y="364">
      <tspan fill="#34d399" font-weight="700">sparksidd@fleet-control</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#f1f5f9">$ </tspan>
      <tspan fill="#38bdf8" class="cursor-blink">█</tspan>
    </text>

  </g>
</svg>