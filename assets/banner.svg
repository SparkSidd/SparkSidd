<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      .ambient-glow { animation: pulse 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="920" height="180" rx="14" fill="url(#bg)" />
  <rect x="0" y="0" width="920" height="180" rx="14" fill="url(#glow)" class="ambient-glow" />

  <!-- Subtle Blueprint Grid Lines -->
  <line x1="0" y1="45" x2="920" y2="45" stroke="#1e293b" stroke-opacity="0.5" stroke-width="0.8" />
  <line x1="0" y1="90" x2="920" y2="90" stroke="#1e293b" stroke-opacity="0.5" stroke-width="0.8" />
  <line x1="0" y1="135" x2="920" y2="135" stroke="#1e293b" stroke-opacity="0.5" stroke-width="0.8" />
  
  <line x1="230" y1="0" x2="230" y2="180" stroke="#1e293b" stroke-opacity="0.4" stroke-width="0.8" />
  <line x1="460" y1="0" x2="460" y2="180" stroke="#1e293b" stroke-opacity="0.4" stroke-width="0.8" />
  <line x1="690" y1="0" x2="690" y2="180" stroke="#1e293b" stroke-opacity="0.4" stroke-width="0.8" />

  <!-- Top Accent Beam -->
  <line x1="40" y1="2" x2="880" y2="2" stroke="url(#lineGrad)" stroke-width="2.5" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="918" height="178" rx="13" fill="none" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />

  <!-- Status Chip (Top Right) -->
  <g transform="translate(680, 24)">
    <rect width="200" height="26" rx="13" fill="#022c22" fill-opacity="0.8" stroke="#059669" stroke-width="1" />
    <circle cx="16" cy="13" r="4.5" fill="#34d399" />
    <text x="28" y="17" fill="#6ee7b7" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">OPEN FOR RESEARCH &amp; ROLES</text>
  </g>

  <!-- Location Tag (Top Left) -->
  <g transform="translate(40, 26)">
    <text x="0" y="14" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">📍 Sikkim, India • Autonomous Systems</text>
  </g>

  <!-- Main Headline Title -->
  <text x="40" y="98" fill="url(#textGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Siddharth Kumar</text>

  <!-- Sub-headline Description -->
  <text x="42" y="128" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="0.8">SYSTEMS &amp; MULTI-AGENT ROBOTICS ENGINEER</text>

  <text x="42" y="152" fill="#94a3b8" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" font-weight="500">Autonomous Fleet Pathfinding • Acoustic Signal Processing • Mathematical Optimization</text>
</svg>
