<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      @keyframes ping {
        0% { r: 4px; opacity: 1; }
        100% { r: 10px; opacity: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes ticker {
        0%, 28% { opacity: 1; transform: translateY(0px); }
        33%, 61% { opacity: 0; transform: translateY(-8px); }
        66%, 95% { opacity: 0; transform: translateY(8px); }
      }
      @keyframes ticker1 {
        0%, 28% { opacity: 1; }
        33%, 100% { opacity: 0; }
      }
      @keyframes ticker2 {
        0%, 30% { opacity: 0; }
        35%, 63% { opacity: 1; }
        68%, 100% { opacity: 0; }
      }
      @keyframes ticker3 {
        0%, 65% { opacity: 0; }
        70%, 98% { opacity: 1; }
        100% { opacity: 0; }
      }
      .glow-orb { animation: pulse 6s ease-in-out infinite; }
      .ping-circle { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .hud-card { animation: floatSlow 5s ease-in-out infinite; }
      .tick-line1 { animation: ticker1 12s infinite; font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #94a3b8; }
      .tick-line2 { animation: ticker2 12s infinite; font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #94a3b8; }
      .tick-line3 { animation: ticker3 12s infinite; font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Card Background with Rounded Corners -->
  <rect x="2" y="2" width="916" height="316" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glowing Orbs -->
  <rect x="2" y="2" width="916" height="316" rx="20" fill="url(#cyanGlow)" class="glow-orb" />
  <rect x="2" y="2" width="916" height="316" rx="20" fill="url(#purpleGlow)" class="glow-orb" />

  <!-- Top Terminal Header Bar -->
  <path d="M 2 20 Q 2 2 20 2 L 900 2 Q 918 2 918 20 L 918 42 L 2 42 Z" fill="#0f172a" fill-opacity="0.6" />
  <line x1="2" y1="42" x2="918" y2="42" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="24" cy="22" r="5" fill="#ef4444" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" />
  <circle cx="56" cy="22" r="5" fill="#10b981" />

  <!-- Terminal Title -->
  <text x="80" y="27" fill="#64748b" font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="600">sparksidd@fleet-systems: ~/telemetry</text>

  <!-- Online Live Status Indicator Pill (Right Aligned) -->
  <g transform="translate(710, 11)">
    <rect width="185" height="22" rx="11" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="0.8" />
    <circle cx="16" cy="11" r="4" fill="#34d399" />
    <circle cx="16" cy="11" r="4" fill="none" stroke="#34d399" stroke-width="1.5" class="ping-circle" />
    <text x="28" y="15" fill="#a7f3d0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">OPEN FOR ROLES &amp; RESEARCH</text>
  </g>

  <!-- Hero Content -->
  <!-- Name with Gradient -->
  <text x="46" y="105" fill="url(#titleGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Siddharth Kumar</text>

  <!-- Role Subtitle with Tech Accent -->
  <text x="48" y="136" fill="#f8fafc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">SYSTEMS ENGINEER &amp; MULTI-AGENT ARCHITECT</text>
  <text x="48" y="158" fill="#38bdf8" font-family="'Fira Code', 'Courier New', monospace" font-size="13" font-weight="500">Autonomous Robotics • Acoustic Signal Processing • Resilient Distributed Systems</text>

  <!-- Interactive Terminal Prompt Box -->
  <g transform="translate(46, 180)">
    <rect width="828" height="42" rx="10" fill="#090d16" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="26" fill="#38bdf8" font-family="'Fira Code', 'Courier New', monospace" font-size="14" font-weight="700">❯</text>
    
    <!-- Ticker line 1 -->
    <text x="36" y="26" class="tick-line1">Building Decentralized AMR Fleet Coordination Framework (BEL Challenge)</text>
    <!-- Ticker line 2 -->
    <text x="36" y="26" class="tick-line2">Researching Indoor Acoustic Source Localization (3,150 Simulations Validated)</text>
    <!-- Ticker line 3 -->
    <text x="36" y="26" class="tick-line3">Engineering High-Performance Distributed Systems &amp; Calibrated AI Co-Pilots</text>
  </g>

  <!-- Bottom Metric Badges Bar -->
  <g transform="translate(46, 246)">
    <!-- Metric 1: Fleet -->
    <g transform="translate(0, 0)">
      <rect width="195" height="44" rx="10" fill="url(#badgeGrad)" stroke="#334155" stroke-width="0.8" />
      <text x="14" y="19" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">MULTI-ROBOT FLEET</text>
      <text x="14" y="35" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="700">0 Collisions • 121 Tests</text>
    </g>

    <!-- Metric 2: Acoustic Source Localization -->
    <g transform="translate(210, 0)">
      <rect width="195" height="44" rx="10" fill="url(#badgeGrad)" stroke="#334155" stroke-width="0.8" />
      <text x="14" y="19" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">ACOUSTIC LOCALIZATION</text>
      <text x="14" y="35" fill="#a855f7" font-family="'Fira Code', monospace" font-size="13" font-weight="700">3,150 Grid Simulations</text>
    </g>

    <!-- Metric 3: Contributions -->
    <g transform="translate(420, 0)">
      <rect width="195" height="44" rx="10" fill="url(#badgeGrad)" stroke="#334155" stroke-width="0.8" />
      <text x="14" y="19" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">GITHUB ACTIVITY</text>
      <text x="14" y="35" fill="#22c55e" font-family="'Fira Code', monospace" font-size="13" font-weight="700">2,100+ Commits • 61d Streak</text>
    </g>

    <!-- Metric 4: Portfolio Link -->
    <g transform="translate(630, 0)">
      <rect width="198" height="44" rx="10" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="19" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">LIVE PORTFOLIO</text>
      <text x="14" y="35" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13" font-weight="700">siddharth.buzz ↗</text>
    </g>
  </g>
</svg>
